stages:
  setup-hsds:
    cmd: calkit xenv -n decider-2 --no-check -- bash --noprofile 
      --norc -c "envsubst < .hscfg > ~/.hscfg"
    deps:
      - .hscfg
      - .calkit/env-locks/decider-2
    outs: []
    desc: Automatically generated from the 'setup-hsds' stage in 
      calkit.yaml. Changes made here will be overwritten.
  powergenome-data-download:
    cmd: calkit xenv -n decider-2 --no-check -- bash --noprofile 
      --norc modules/CEM/get-powergenome-data.sh
    deps:
      - modules/CEM/get-powergenome-data.sh
      - modules/CEM/get-powergenome-data.sh
      - .calkit/env-locks/decider-2
    outs:
      - modules/CEM/data/cambium/
      - modules/CEM/data/efs/
      - modules/CEM/data/extra_inputs/
      - modules/CEM/data/network_costs/
      - modules/CEM/data/pg/
      - modules/CEM/data/pudl/
      - modules/CEM/data/resource_groups/ipm_regions/existing_resource_groups/
      - modules/CEM/data/resource_profiles/
      - modules/CEM/data_CA/test_misc_gen_inputs.csv
      - modules/CEM/data_CA/test_demand_segments_voll.csv
      - modules/CEM/data_east/Reserves.csv
      - modules/CEM/data_east/emission_policies.csv
      - modules/CEM/data_east/misc_gen_inputs.csv
      - modules/CEM/data_east/resource_capacity_spur.csv
      - modules/CEM/data_east/demand_segments_voll.csv
    desc: Automatically generated from the 'powergenome-data-download'
      stage in calkit.yaml. Changes made here will be overwritten.
  powergenome-manual-data-download:
    cmd: ' bash --noprofile --norc -c "calkit manual-step --message \"Manually
      download any failed gdown files from https://drive.google.com/drive/folders/1K5GWF5lbe-mKSTUSuJxnFdYGCdyDJ7iE
      typically the resource_groups/ipm_regions/ files\""'
    deps: []
    outs:
      - modules/CEM/data/resource_groups/ipm_regions/ipm_offshorewind_fixed_False_group.json:
          cache: true
          persist: true
    desc: Automatically generated from the 
      'powergenome-manual-data-download' stage in calkit.yaml. Changes
      made here will be overwritten.
  setup-sweep:
    cmd: calkit nb execute --environment decider-2 --no-check 
      --language python "modules/CEM/make_additional_tech_csv.ipynb"
    deps:
      - .calkit/notebooks/cleaned/modules/CEM/make_additional_tech_csv.ipynb
      - modules/CEM/template/cost_mult_tech_map.yml
      - modules/CEM/make_additional_tech_csv.ipynb
      - .calkit/env-locks/decider-2
    outs:
      - modules/CEM/data_east/wave_profiles
      - modules/CEM/data_east/settings/settings_management.yml
      - modules/CEM/data_east/scenario_input.csv
      - modules/CEM/data_east/settings/cost_mult_tech_map_updated.yml
      - .calkit/notebooks/executed/modules/CEM/make_additional_tech_csv.ipynb:
          cache: true
    desc: Automatically generated from the 'setup-sweep' stage in 
      calkit.yaml. Changes made here will be overwritten.
  powergenome-run:
    cmd: calkit xenv -n decider-2 --no-check -- bash --noprofile 
      --norc modules/CEM/run_powergenome.sh
    deps:
      - modules/CEM/run_powergenome.sh
      - modules/CEM/run_powergenome.sh
      - modules/CEM/data/
      - modules/CEM/pg-data-env.yml
      - modules/CEM/data_CA/test_misc_gen_inputs.csv
      - modules/CEM/data_CA/test_demand_segments_voll.csv
      - modules/CEM/data_CA/settings/test_settings.yml
      - modules/CEM/data_east/Reserves.csv
      - modules/CEM/data_east/emission_policies.csv
      - modules/CEM/data_east/misc_gen_inputs.csv
      - modules/CEM/data_east/resource_capacity_spur.csv
      - modules/CEM/data_east/demand_segments_voll.csv
      - modules/CEM/data_east/settings/test_settings_2.yml
      - .calkit/env-locks/decider-2
      - modules/CEM/data_east/wave_profiles
      - modules/CEM/data_east/settings/settings_management.yml
      - modules/CEM/data_east/scenario_input.csv
      - modules/CEM/data_east/settings/cost_mult_tech_map_updated.yml
      - .calkit/notebooks/executed/modules/CEM/make_additional_tech_csv.ipynb
    outs:
      - modules/CEM/data_east/cases/Case_year_2030_electrification_ref_carbon_constraint_med_wave_variability_Avail_zeta_${item.zeta}_omega_n_${item.omega_n}_D_f_${item.D_f}_limited_${item.power_limit_x1000}_wave_cost_Wave_${item.wave_cost}/inputs
    matrix:
      zeta:
        - 0.05
      omega_n:
        - 0.5
      D_f:
        - 20
      wave_cost:
        - 13000
      power_limit_x1000:
        - 1000
    desc: Automatically generated from the 'powergenome-run' stage in 
      calkit.yaml. Changes made here will be overwritten.
  genx-setup:
    cmd: ' bash --noprofile --norc -c "julia modules/CEM/setup.jl"'
    deps:
      - modules/CEM/Project.toml
    outs: []
    desc: Automatically generated from the 'genx-setup' stage in 
      calkit.yaml. Changes made here will be overwritten.
  genx-run:
    cmd: ' bash --noprofile --norc -c "julia modules/CEM/Run.jl Case_year_2030_electrification_ref_carbon_constraint_med_wave_variability_Avail_zeta_${item.zeta}_omega_n_${item.omega_n}_D_f_${item.D_f}_limited_${item.power_limit_x1000}_wave_cost_Wave_${item.wave_cost}"'
    deps:
      - modules/CEM/Run.jl
      - modules/CEM/Manifest.toml
      - modules/CEM/data_east/cases/Case_year_2030_electrification_ref_carbon_constraint_med_wave_variability_Avail_zeta_${item.zeta}_omega_n_${item.omega_n}_D_f_${item.D_f}_limited_${item.power_limit_x1000}_wave_cost_Wave_${item.wave_cost}/inputs
    outs:
      - modules/CEM/data_east/cases/Case_year_2030_electrification_ref_carbon_constraint_med_wave_variability_Avail_zeta_${item.zeta}_omega_n_${item.omega_n}_D_f_${item.D_f}_limited_${item.power_limit_x1000}_wave_cost_Wave_${item.wave_cost}/results
    matrix:
      zeta:
        - 0.05
      omega_n:
        - 0.5
      D_f:
        - 20
      wave_cost:
        - 13000
      power_limit_x1000:
        - 1000
    desc: Automatically generated from the 'genx-run' stage in 
      calkit.yaml. Changes made here will be overwritten.
